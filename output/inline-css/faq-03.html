<!-- dp-deps: _c-faq _c-section-title -->
<!-- wp:html -->
<style>
/* dp-faq--c: 白カード式アコーディオン（セクション背景: #f8f8f8） */
.dp-faq--c {
  background-color: #f8f8f8;
}
.dp-faq--c .swell-block-faq__item {
  background-color: #ffffff;
  border-radius: var(--dp-radius);
  padding: var(--dp-space-element-pc);
}
.dp-faq--c .swell-block-faq__item + .swell-block-faq__item {
  margin-top: 16px;
}
@media screen and (max-width: 599px) {
  .dp-faq--c .swell-block-faq__item {
    padding: var(--dp-space-element-sp);
  }
}
/* Q/A アイコン: dp-faq--b と同仕様（box-shadow + SP 縦位置） */
.dp-faq--c .faq_q::before,
.dp-faq--c .faq_a::before {
  box-shadow: 0 0 0 1px inset;
}
@media screen and (max-width: 599px) {
  .dp-faq--c .faq_q::before,
  .dp-faq--c .faq_a::before {
    top: 0.25em;
  }
}
/* Q（質問）エリア */
.dp-faq--c .faq_q {
  cursor: pointer;
  padding-top: 1em;
  padding-bottom: 1em;
  padding-right: 2.5em;
  font-weight: var(--dp-font-weight-heading);
}
/* 矢印アイコン（デフォルト: 下向き） */
.dp-faq--c .faq_q::after {
  content: "\e921";
  font-family: icomoon;
  font-style: normal;
  font-weight: normal;
  -webkit-font-smoothing: antialiased;
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
  transition: transform 0.3s ease;
}
/* 開いているアイテムの矢印: 上向きに反転 */
.dp-faq--c .swell-block-faq__item.is-open .faq_q::after {
  transform: translateY(-50%) rotate(-90deg);
}
/* A（回答）エリア: デフォルト非表示 */
.dp-faq--c .faq_a {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
.dp-faq--c .faq_a p:last-child {
  margin-bottom: 0;
}
.dp-faq--c .faq_a::before {
  top: 0.85em;
}
/* is-open 時: スライド表示 */
.dp-faq--c .swell-block-faq__item.is-open .faq_a {
  max-height: 500px;
  padding-top: 1em !important;
}
</style>
<!-- /wp:html -->
